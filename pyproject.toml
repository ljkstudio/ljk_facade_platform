[project]
name = "ljk-facade-platform"
version = "0.1.0"
description = "LJK Facade Platform — Adaptive Mold, REST API, Dashboard"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27.0"]

[tool.setuptools.packages.find]
include = ["api*", "core*", "gh_components*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
